name: 5 - Daily Drift Check

on:
  schedule:
    - cron: "0 8 * * *" # Run every day at 8am
  workflow_dispatch:

env:
  MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
  MLFLOW_MODEL_NAME: ${{ vars.MLFLOW_MODEL_NAME }}
  GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
  DRY_RUN: "true"

jobs:
  check-drift:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # 1. SETUP SSH (Copied from 2_continuous_delivery.yml)
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DVC_SSH_KEY }}" > ~/.ssh/dvc_runner_key
          chmod 600 ~/.ssh/dvc_runner_key

          # Configure SSH to use this key for your internal host
          echo "Host the-traffickers-internal.dei.uc.pt
              IdentityFile ~/.ssh/dvc_runner_key
              StrictHostKeyChecking no" >> ~/.ssh/config

      # 2. DOWNLOAD LOGS
      - name: Download Logs
        run: |
          mkdir -p logs
          # We use the explicit hostname so it matches the ~/.ssh/config entry above
          scp -r ${{ secrets.SSH_USER }}@the-traffickers-internal.dei.uc.pt:/home/admin/Desktop/Flask/serving/logs/* ./logs/ || echo "No logs found, creating empty directory"

      # 3. BUILD & RUN DOCKER CONTAINER
      - name: Run Drift Check in Docker
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_PASSWORD }}
        run: |
          # Build the image using your Dockerfile.monitoring
          docker build -t drift-checker -f monitoring/Dockerfile.monitoring .

          # Run the container
          # -v $(pwd)/logs:/app/logs: Maps the logs we just downloaded into the container
          # --env-file: Passes all current env vars (MLFLOW_*, GITHUB_*, etc) to container
          docker run --rm \
            -v $(pwd)/logs:/app/logs \
            -e MLFLOW_TRACKING_URI \
            -e MLFLOW_MODEL_NAME \
            -e MLFLOW_TRACKING_USERNAME \
            -e MLFLOW_TRACKING_PASSWORD \
            -e GITHUB_TOKEN \
            -e GITHUB_REPOSITORY \
            -e DRY_RUN \
            drift-checker
