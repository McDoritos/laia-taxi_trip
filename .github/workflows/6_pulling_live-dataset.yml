name: 6 - Pulling Live Dataset
run-name: "${{ github.workflow }}"

permissions: write-all

on:
  workflow_run:
    workflows: ["5 - Daily Drift Check"]
    types: [completed]
    branches: [main]

jobs:
  check_for_drift:
    runs-on: self-hosted
    outputs:
      drift_found: ${{ steps.check.outputs.result }}
    steps:
      - name: Check if drift artifact exists
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const drift = artifacts.data.artifacts.find(a => a.name === 'drift-detected');
            return drift ? 'true' : 'false';
          result-encoding: string

  pull_and_version:
    needs: check_for_drift
    if: needs.check_for_drift.outputs.drift_found == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }

      # Install dependencies including DVC with SSH support
      - run: pip install uv "dvc[ssh]" pandas pyarrow

      # --- SSH SETUP FROM YOUR REFERENCE FILE ---
      - name: Setup SSH for DVC
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DVC_SSH_KEY }}" > ~/.ssh/dvc_runner_key
          chmod 600 ~/.ssh/dvc_runner_key

          # Configure SSH to use this key for your internal host
          echo "Host the-traffickers-internal.dei.uc.pt
              IdentityFile ~/.ssh/dvc_runner_key
              StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Clean DVC Cache
        run: |
          echo "Cleaning .dvc/cache to prevent corruption..."
          rm -rf .dvc/cache
      # ------------------------------------------
      - name: Pull live logs from Flask VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /tmp/live_logs
            # Copy logs to a temp location so we can download them
            # UPDATED PATHS BELOW:
            cp /home/admin/Desktop/Flask/serving/logs/inference_logs.jsonl /tmp/live_logs/
            cp /home/admin/Desktop/Flask/serving/logs/labels.jsonl /tmp/live_logs/

      - name: Copy logs from VM to runner
        run: |
          mkdir -p data/live_logs
          # Create temporary key for SCP
          echo "${{ secrets.SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

          scp -i private_key.pem -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/live_logs/*.jsonl \
            data/live_logs/

          rm private_key.pem

      - name: Build retraining dataset
        run: python retraining/build_retraining_dataset.py

      - name: Version retraining dataset with DVC
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          dvc add data/retraining_dataset.parquet
          dvc push

          # Add both the DVC file and the local gitignore
          git add data/retraining_dataset.parquet.dvc data/.gitignore

          # Commit only if there are changes, preventing exit code 1
          git diff --staged --quiet || git commit -m "Add live retraining dataset [skip ci]"
          git push
      - name: Create drift signal
        run: echo "drift detected" > drift_signal.txt

      - name: Upload drift signal artifact
        uses: actions/upload-artifact@v4
        with:
          name: drift-detected
          path: drift_signal.txt
