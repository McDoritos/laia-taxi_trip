name: 2 - Continuous Delivery
run-name: "${{ github.workflow }}"

permissions: write-all

on:
  workflow_run:
    workflows: ["1 - Continuous Integration"]
    types: [completed]
  workflow_dispatch:

env:
  REGISTRY: ${{ vars.REGISTRY }}
  MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
  MLFLOW_EXPERIMENT_NAME: ${{ vars.MLFLOW_EXPERIMENT_NAME }}
  MLFLOW_MODEL_NAME: ${{ vars.MLFLOW_MODEL_NAME }}

jobs:
  train-model:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted # Running on your internal infrastructure
    steps:
      - uses: actions/checkout@v4

      # 1. Install DVC and SSH support
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install uv "dvc[ssh]"

      # 2. Setup SSH for DVC (Connects to internal server)
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DVC_SSH_KEY }}" > ~/.ssh/dvc_runner_key
          chmod 600 ~/.ssh/dvc_runner_key

          # SSH precisa saber qual chave usar:
          echo "Host the-traffickers-internal.dei.uc.pt
              IdentityFile ~/.ssh/dvc_runner_key
              StrictHostKeyChecking no" >> ~/.ssh/config

      # --- ADD THIS STEP HERE ---
      - name: Clean DVC Cache
        run: |
          echo "Cleaning .dvc/cache to prevent corruption on self-hosted runner..."
          rm -rf .dvc/cache
      # --------------------------
      # 3. Pull Data from Remote Storage
      - name: DVC Pull
        run: dvc pull -v --jobs 1 Dataset/2011.dvc Dataset/2012.dvc
      # 4. DEBUG: Verify Data Existence
      # This step checks if 'Dataset' folder exists and has the parquet file.
      # If this fails, it means your DVC tracked folder is named something else!
      - name: Check Data Path
        run: |
          echo "Checking contents of workspace..."
          ls -F
          echo "Checking contents of Dataset folder..."
          ls -F Dataset/ || echo "WARNING: Dataset folder not found in root!"

      # 5. Docker Login
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Pull the Docker Image
      - run: docker pull ${{ env.REGISTRY }}/mcdoritos/laia-taxi_trip/training:${{ github.sha }}

      # 7. Run Training with Volume Mount
      - name: Run training
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_PASSWORD }}
          MLFLOW_EXPERIMENT_NAME: ${{ env.MLFLOW_EXPERIMENT_NAME }}
          MLFLOW_MODEL_NAME: ${{ env.MLFLOW_MODEL_NAME }}
          COMMIT_SHA: ${{ github.sha }}
          # This tells your python script to look in the mount point
          PATH_DATASET: /app/Dataset
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/Dataset:/app/Dataset \
            -e PATH_DATASET=/app/Dataset \
            -e MLFLOW_TRACKING_URI \
            -e MLFLOW_TRACKING_USERNAME \
            -e MLFLOW_TRACKING_PASSWORD \
            -e MLFLOW_MODEL_NAME \
            -e MLFLOW_EXPERIMENT_NAME \
            -e COMMIT_SHA \
            ${{ env.REGISTRY }}/mcdoritos/laia-taxi_trip/training:${{ github.sha }} \
            python train_model.py

        # Download serving image built in the previous stage
      - run: docker pull ${{ env.REGISTRY }}/mcdoritos/laia-taxi_trip/serving:${{ github.sha }}

      #In case of failure of the workflow the old serving container is removed
      - name: Cleanup old serving container
        run: |
          docker rm -f serving-app 2>/dev/null || true

      # Start serving image
      # It is configured to load the model passed in env variable MLFLOW_MODEL_NAME and alias MODEL_ALIAS
      - name: Start serving container
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_PASSWORD }}
          MODEL_ALIAS: ${{ github.sha }}
          MLFLOW_MODEL_NAME: ${{ env.MLFLOW_MODEL_NAME }}
        run: |
          docker run -d \
            --user $(id -u):$(id -g) \
            --name serving-app \
            -p 8080:8080 \
            -v $(pwd)/logs:/app/logs \
            -e LOG_DIR=/app/logs \
            -e MLFLOW_TRACKING_URI \
            -e MLFLOW_TRACKING_USERNAME \
            -e MLFLOW_TRACKING_PASSWORD \
            -e MODEL_ALIAS \
            -e MLFLOW_MODEL_NAME \
            ${{ env.REGISTRY }}/mcdoritos/laia-taxi_trip/serving:${{ github.sha }}

          sleep 10

      # Run end to end tests, this will test the serving app to see if it is working ok
      # Additional metrics and verification can assess performance metrics as well
      - name: Run Staging tests
        run: uv run pytest tests/test_e2e.py -v

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Flask logs ==="
          docker logs serving-app || true

      # Log in to GitHub Container Registry (GHCR)
      # This is the repository where we will upload our images once they have been validated
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag serving image with staging; this image will be used for further testing in staging
      # Push serving image to repository
      - name: Push serving staging image
        run: |
          docker tag ${{ env.REGISTRY }}/mcdoritos/laia-taxi_trip/serving:${{ github.sha }} \
                     ${{ env.REGISTRY }}/mcdoritos/laia-taxi_trip/serving:staging
          docker push ${{ env.REGISTRY }}/mcdoritos/laia-taxi_trip/serving:staging

      # 8. Promote Model
      - name: Promote model to staging
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_PASSWORD }}
          MLFLOW_EXPERIMENT_NAME: ${{ env.MLFLOW_EXPERIMENT_NAME }}
          MLFLOW_MODEL_NAME: ${{ env.MLFLOW_MODEL_NAME }}
          FROM_ALIAS: ${{ github.sha }}
          TO_ALIAS: staging
        run: uv run python model-promotion/promote_model.py
