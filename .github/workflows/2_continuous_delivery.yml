name: 2 - Continuous Delivery
run-name: "${{ github.workflow }}"

permissions: write-all

on:
  workflow_run:
    workflows: ["1 - Continuous Integration"]
    types: [completed]
  workflow_dispatch:

env:
  REGISTRY: ${{ vars.REGISTRY }}
  MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
  MLFLOW_EXPERIMENT_NAME: ${{ vars.MLFLOW_EXPERIMENT_NAME }}
  MLFLOW_MODEL_NAME: ${{ vars.MLFLOW_MODEL_NAME }}

jobs:
  train-model:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted # Running on your internal infrastructure
    steps:
      - uses: actions/checkout@v4

      # 1. Install DVC and SSH support
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install uv "dvc[ssh]"

      # 2. Setup SSH for DVC (Connects to internal server)
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DVC_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H the-traffickers-internal.dei.uc.pt >> ~/.ssh/known_hosts

      # 3. Pull Data from Remote Storage
      - name: DVC Pull
        run: dvc pull Dataset/2011.dvc Dataset/2012.dvc

      # 4. DEBUG: Verify Data Existence
      # This step checks if 'Dataset' folder exists and has the parquet file.
      # If this fails, it means your DVC tracked folder is named something else!
      - name: Check Data Path
        run: |
          echo "Checking contents of workspace..."
          ls -F
          echo "Checking contents of Dataset folder..."
          ls -F Dataset/ || echo "WARNING: Dataset folder not found in root!"

      # 5. Docker Login
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Pull the Docker Image
      - run: docker pull ${{ env.REGISTRY }}/mcdoritos/laia-taxi_trip/training:${{ github.sha }}

      # 7. Run Training with Volume Mount
      - name: Run training
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_PASSWORD }}
          MLFLOW_EXPERIMENT_NAME: ${{ env.MLFLOW_EXPERIMENT_NAME }}
          MLFLOW_MODEL_NAME: ${{ env.MLFLOW_MODEL_NAME }}
          COMMIT_SHA: ${{ github.sha }}
          # This tells your python script to look in the mount point
          PATH_DATASET: /app/Dataset
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/Dataset:/app/Dataset \
            -e PATH_DATASET=/app/Dataset \
            -e MLFLOW_TRACKING_URI \
            -e MLFLOW_TRACKING_USERNAME \
            -e MLFLOW_TRACKING_PASSWORD \
            -e MLFLOW_MODEL_NAME \
            -e MLFLOW_EXPERIMENT_NAME \
            -e COMMIT_SHA \
            ${{ env.REGISTRY }}/mcdoritos/laia-taxi_trip/training:${{ github.sha }} \
            python train_model.py

      # 8. Promote Model
      - name: Promote model to staging
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_PASSWORD }}
          MLFLOW_EXPERIMENT_NAME: ${{ env.MLFLOW_EXPERIMENT_NAME }}
          MLFLOW_MODEL_NAME: ${{ env.MLFLOW_MODEL_NAME }}
          FROM_ALIAS: ${{ github.sha }}
          TO_ALIAS: staging
        run: uv run python model-promotion/promote_model.py
