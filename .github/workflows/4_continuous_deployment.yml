name: 4 - Continuous Deployment
run-name: "${{ github.workflow }}"

permissions: write-all

on:
  # Runs when the previous stage finished
  workflow_run:
    workflows: ["3 - Continuous Staging"]
    types: [completed]

  workflow_dispatch:

env:
  REGISTRY: ${{ vars.REGISTRY }}
  MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
  MLFLOW_EXPERIMENT_NAME: ${{ vars.MLFLOW_EXPERIMENT_NAME }}
  MLFLOW_MODEL_NAME: ${{ vars.MLFLOW_MODEL_NAME }}

jobs:
  deploy-prod:
    # Run only if previous stage finished successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if API changed
        id: api_changed
        shell: bash
        run: |
          git fetch origin main
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep '^serving/' || true)
          echo "Changed files: $CHANGED"
          if [ -n "$CHANGED" ]; then
            echo "API_CHANGED=true" >> $GITHUB_ENV
            echo "SERVING_TAG=${{ github.sha }}" >> $GITHUB_ENV
            echo "API changes detected"
          else
            echo "API_CHANGED=false" >> $GITHUB_ENV
            echo "SERVING_TAG=production" >> $GITHUB_ENV
            echo "No API changes detected"
          fi

      # Here we are just loging in to GHCR and pulling the serving image with production tag and running it
      # In a real setup the deployment can be made in several ways, depending on the automation,
      # purpose, and infra. Some examples:
      # - We can connect through ssh and update the env
      # - if we have orchestrators we can send/define/update the new versions to where the system is watching
      # - the system itself might be monitoring repos and update when the new versions are pushed
      # Also, in real setups the infra will be decoupled from the models. Here everything moves forward together
      # but if we only change the model it is not necessary to redeploy the infrascruture. Serving frameworks
      # such as TF serving can manage model A/B testing, rollout, rollback, ...
      # 1. Install DVC and SSH support
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install uv "dvc[ssh]"

      # 2. Setup SSH for DVC (Connects to internal server)
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DVC_SSH_KEY }}" > ~/.ssh/dvc_runner_key
          chmod 600 ~/.ssh/dvc_runner_key

          # SSH precisa saber qual chave usar:
          echo "Host the-traffickers-internal.dei.uc.pt
              IdentityFile ~/.ssh/dvc_runner_key
              StrictHostKeyChecking no" >> ~/.ssh/config

      # --- ADD THIS STEP HERE ---
      - name: Clean DVC Cache
        run: |
          echo "Cleaning .dvc/cache to prevent corruption on self-hosted runner..."
          rm -rf .dvc/cache
      # --------------------------
      # 3. Pull Data from Remote Storage
      - name: DVC Pull
        run: dvc pull -v --jobs 1 Dataset/2013.dvc
      # 4. DEBUG: Verify Data Existence
      # This step checks if 'Dataset' folder exists and has the parquet file.
      # If this fails, it means your DVC tracked folder is named something else!
      - name: Check Data Path
        run: |
          echo "Checking contents of workspace..."
          ls -F
          echo "Checking contents of Dataset folder..."
          ls -F Dataset/ || echo "WARNING: Dataset folder not found in root!"

      - name: Check Data Path
        run: |
          echo "Checking contents of workspace..."
          ls -F
          echo "Checking contents of tests folder..."
          ls -F tests/ || echo "WARNING: tests folder not found in root!"

      - name: Run A/B Test
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
          MLFLOW_MODEL_NAME: ${{ env.MLFLOW_MODEL_NAME }}
          PROD_ALIAS: production
          STAGING_ALIAS: staging
          VALIDATION_DATA: Dataset/2013
        run: uv run python tests/test_ab.py
        continue-on-error: true

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------
      # Promote model to production
      - name: Promote model to staging
        if: steps.ab_test.conclusion == 'success'
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_PASSWORD }}
          MLFLOW_EXPERIMENT_NAME: ${{ env.MLFLOW_EXPERIMENT_NAME }}
          MLFLOW_MODEL_NAME: ${{ env.MLFLOW_MODEL_NAME }}
          FROM_ALIAS: staging
          TO_ALIAS: production
        run: uv run python model-promotion/promote_model.py

      # 1. COPY the new script from GitHub Runner -> Your VM
      - name: Update Deploy Script on Server
        if: env.API_CHANGED == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "serving/deploy.sh" # File in your repo
          target: "/home/admin/Desktop/Flask/" # Folder on your VM
          strip_components: 1 # Removes 'serving/' prefix when copying

      # 2. RUN the script
      - name: Deploy to Production
        if: env.API_CHANGED == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/admin/Desktop/Flask
            bash deploy.sh ${{ github.actor }} ${{ secrets.GITHUB_TOKEN }}
