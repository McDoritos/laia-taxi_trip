name: 2b - Retraining
run-name: "${{ github.workflow }}"

permissions: write-all

on:
  workflow_run:
    workflows: ["5 - Daily Drift Check"]
    types: [completed]
    branches: [main]

jobs:
  retrain-if-drift:
    runs-on: self-hosted
    steps:
      - name: Check if drift artifact exists
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const drift = artifacts.data.artifacts.find(a => a.name === 'drift-detected');
            return drift ? 'true' : 'false';
          result-encoding: string

      - name: Checkout
        if: steps.check.outputs.result == 'true'
        uses: actions/checkout@v4

      - name: Run retraining
        if: steps.check.outputs.result == 'true'
        run: |
          echo "Drift detected. Starting retraining..."
          # seu script de retraining aqui

      


      